# Pre-commit hooks for client-side secret scanning + GH Action SHA pinning.
# Setup (one-time, in this repo):
#   pip install pre-commit
#   pre-commit install                         # writes .git/hooks/pre-commit
#   pre-commit install --hook-type pre-push    # writes .git/hooks/pre-push
#   pre-commit run --all-files                 # one-time scan of existing tree
#
# After install, every `git commit` runs gitleaks against the staged diff, and
# every `git push` re-runs it as a safety net for commits made with --no-verify.
# A detected secret blocks the commit / push. Add false positives to
# .gitleaksignore.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
      - id: gitleaks
        name: gitleaks (pre-push)
        stages: [pre-push]

  # SHA-pin GitHub Actions on commit (e.g. actions/checkout@v4 -> @<sha> # v4).
  - repo: https://github.com/suzuki-shunsuke/pinact
    rev: v3.0.0
    hooks:
      - id: pinact

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
