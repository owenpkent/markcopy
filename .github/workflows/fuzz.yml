name: Fuzz

# Coverage-guided fuzzing (Jazzer.js) of the parsers that read files the user did
# not write. See docs/TESTING.md#fuzzing. Not part of CI: it is open-ended by
# nature, so it runs nightly and reports through issues instead of failing PRs.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target
        type: number
        default: 10

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Expressions have no arithmetic, so this is a ceiling rather than the budget
    # plus a margin. The budget itself is capped to fit under it in the Fuzz step.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            zip,
            xlsx,
            pptx,
            xml,
            csv,
            review,
            markdown,
            gif,
            stl,
            3mf,
            gcode,
            glb,
            obj,
            step,
            video-probe,
            audio-probe,
            messages,
            docx,
            pe,
            pkg,
            pkg-elf,
            pkg-rpm,
            pkg-deb,
            pkg-msi,
            pkg-xar,
            pkg-zip,
            pkg-alpine,
            pkg-macho,
            pkg-dmg,
            cpio,
            dex,
            go-buildinfo,
            signer,
            ooxml-encrypted,
            file-source,
            links,
            markdown-html,
            paste-export,
            export-ooxml,
            image,
            image-png,
            image-jpeg,
            image-webp,
            image-bmp,
            image-ico,
            image-avif,
            image-svg,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The evolved corpus is the point of running nightly: each run starts from
      # the last one's coverage. Every run saves under a fresh key, and restores
      # the newest one for this target.
      - name: Restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        # Explicit, so the step runs with pipefail and a crash fails it through tee.
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MINUTES: ${{ inputs.minutes || 10 }}
        run: |
          minutes=$(( MINUTES > 60 ? 60 : MINUTES ))
          export FUZZ_SECONDS=$(( minutes * 60 ))
          mkdir -p "fuzz/crashes/$TARGET"
          npm run fuzz -- "$TARGET" 2>&1 | tee "fuzz/crashes/$TARGET/fuzz.log"

      # Save even when the fuzzer found a crash, so the run's coverage is kept.
      - name: Save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/.corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          # The directory above the target's, so the zip holds <target>/crash-*
          # and the report job can read the target from the path.
          path: fuzz/crashes
          if-no-files-found: ignore

  # Kept apart from the job that runs the fuzzer so that job never holds a token
  # that can write issues.
  report:
    name: Report crashes
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download crash artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fuzz-crash-*
          path: crashes
          # With exactly one match the action extracts straight into path and
          # adds no per-artifact folder, so the layout has to be the same for
          # one crash or many: crashes/<target>/.
          merge-multiple: true

      - name: Open or update issues
        run: |
          shopt -s nullglob
          for dir in crashes/*/; do
            dir="${dir%/}"
            target="${dir#crashes/}"
            inputs=("$dir"/crash-* "$dir"/oom-* "$dir"/timeout-* "$dir"/slow-unit-*)
            if [ ${#inputs[@]} -eq 0 ]; then
              # No input file, but the fuzz step ran (it wrote the log) and
              # failed, so the target itself is broken: for example it no
              # longer loads. That once went unnoticed for three nights, so it
              # gets an issue of its own. No log means install or checkout
              # failed, which the failed job in the run shows.
              [ -f "$dir/fuzz.log" ] || continue
              title="Fuzz target broken: $target"
              # Variants replay as their catch-all target.
              base="$target"
              case "$target" in image-* | pkg-*) base="${target%%-*}" ;; esac
              {
                echo "The nightly fuzz run could not fuzz the \`$target\` target: it failed without a crashing input."
                echo
                echo "Run: $RUN_URL"
                echo
                echo "Reproduce with \`npm run fuzz:replay -- $base\`. End of the fuzzer log:"
                echo '```'
                tail -n 40 "$dir/fuzz.log"
                echo '```'
              } > body.md
            else
              title="Fuzz crash: $target"
              first="${inputs[0]}"
              {
                echo "The nightly fuzz run found an input that makes the \`$target\` target fail."
                echo
                echo "Run: $RUN_URL (artifact \`fuzz-crash-$target\`, file \`$(basename "$first")\`)"
                echo
                echo "Input ($(wc -c < "$first") bytes, base64; large inputs are in the artifact only):"
                echo '```'
                if [ "$(wc -c < "$first")" -le 4000 ]; then base64 -w 76 "$first"; else echo "(see artifact)"; fi
                echo '```'
                echo
                echo "End of the fuzzer log:"
                echo '```'
                tail -n 40 "$dir/fuzz.log"
                echo '```'
              } > body.md
            fi
            number=$(gh issue list --state open --search "\"$title\" in:title" \
              --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$number" ]; then
              gh issue comment "$number" --body-file body.md
            else
              gh issue create --title "$title" --body-file body.md
            fi
          done

  # Line coverage of the parser modules from a replay of the committed seeds,
  # against the minimums in fuzz/coverage.json. It runs the repository's code, so
  # it holds no token that can write issues; the job after it does that, and never
  # runs the repository's code. Not run on pull requests: this workflow is not.
  coverage:
    name: Measure parser coverage
    needs: fuzz
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Writes the table to the job summary and fuzz/coverage-report/.
      - name: Measure
        run: node fuzz/coverage-report.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-coverage
          path: fuzz/coverage-report/fuzz-coverage.*
          if-no-files-found: ignore

  # Opens or updates "Fuzz coverage below threshold" while any parser is under its
  # minimum, and closes it when none is. Default branch only: the issue is shared by
  # the repository, so a manual run on a feature branch reports and uploads the
  # artifact but leaves the issue alone. A scheduled run is always on the default
  # branch, so it does not depend on its event payload naming that branch.
  coverage-issue:
    name: Coverage issue
    needs: coverage
    if: >-
      always() && needs.coverage.result == 'success' &&
      (github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Fuzz coverage below threshold
      LABEL: fuzz-coverage
    steps:
      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fuzz-coverage
          path: report

      - name: Open, update or close the issue
        run: |
          gh label create "$LABEL" --description "A parser is under its fuzz coverage minimum" \
            --color D93F0B 2>/dev/null || true
          number=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          files=$(jq -r '.below | sort | join(",")' report/fuzz-coverage.json)
          if [ -z "$files" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Every parser is back at or above its minimum in $RUN_URL. Closing."
              gh issue close "$number"
            fi
            exit 0
          fi
          {
            echo "These parsers are under their \`minLineCoverage\` in \`fuzz/coverage.json\` when the committed seeds are replayed."
            echo
            echo "Run: $RUN_URL"
            echo
            jq -r '.rows[] | select(.below) | "- `\(.file)`: \(.percent)% of \(.total) lines, minimum \(.min)% (targets: \(.targets | join(", ")))"' report/fuzz-coverage.json
            echo
            echo "Add seeds or dictionary tokens for the lines a target does not reach (see docs/FUZZING-STRATEGY.md), or lower the minimum with a reason."
            echo
            echo "<!-- files: $files -->"
          } > body.md
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md
          else
            current=$(gh issue view "$number" --json body --jq .body)
            # Only when the set of files changed, so a steady state is not a nightly comment.
            if [[ "$current" != *"<!-- files: $files -->"* ]]; then
              gh issue edit "$number" --body-file body.md
              gh issue comment "$number" --body-file body.md
            fi
          fi
