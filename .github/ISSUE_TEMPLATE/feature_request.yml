name: Feature request
description: Suggest an idea or improvement
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that MarkCopy does not support yet?
      placeholder: I want to copy a section as clean Markdown when my selection spans several blocks.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like MarkCopy to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or existing workarounds.

  - type: checkboxes
    id: area
    attributes:
      label: Area
      options:
        - label: New copy format or clipboard behavior
        - label: Rendering (Mermaid, math, syntax, styling)
        - label: Context menu or commands
        - label: Settings or configuration
        - label: Other
