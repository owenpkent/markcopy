version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node the extension host actually runs, not the
      # newest Node that exists. VS Code ^1.90 ships Node 20 and CI builds on 20,
      # so a bump to 22+ would let code type-check against APIs that are not
      # there at runtime. Raise this deliberately when engines.vscode moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jsdom 30 requires Node 22 or newer; the test job runs Node 20, where it
      # fails at worker startup on a missing undici internal. Same reasoning:
      # unpin when the project's Node floor moves.
      - dependency-name: 'jsdom'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
