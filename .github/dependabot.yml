version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node tracks the Node the extension host actually runs, not the
      # newest Node that exists. VS Code ^1.90 ships Node 20, so a bump to 22+
      # would let code type-check against APIs that are not there at runtime.
      # CI runs Node 22 for the packaging tools, but that is not the host.
      # Raise this deliberately when engines.vscode moves.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # @types/vscode is pinned to the engine floor, not the newest VS Code that
      # exists. `vsce package` compares the *range* in package.json against
      # engines.vscode and refuses to build when it is higher, so any bump here
      # fails CI at the packaging step even though tsc is happy. Every update
      # type is ignored: 1.90 -> 1.134 is only a minor, and it still breaks.
      # Raise this together with engines.vscode, never on its own.
      - dependency-name: '@types/vscode'
      # Vitest 5 requires @types/node 22+, but the extension host type
      # definitions stay on Node 20 (see @types/node above), so CI's move to
      # Node 22 does not unblock it. Raise this deliberately when
      # engines.vscode moves.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # typescript-eslint 8 peers on `typescript >=4.8.4 <6.1.0`, so a bump to 7
      # cannot install at all: npm ci fails with ERESOLVE and both CI jobs die
      # before running a test. TypeScript 6 installs but cannot see @types/node
      # under this tsconfig. Both want a deliberate PR that moves the linter and
      # the tsconfig together, not an automated bump.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    commit-message:
      prefix: deps
      prefix-development: deps-dev

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
